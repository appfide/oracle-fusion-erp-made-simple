name: Release

# Pushing a version tag (v1.2.3) publishes a GitHub release with the built site as a zip, its
# SHA-256 checksums, and a Sigstore-signed SLSA provenance attestation. Anyone can check that a
# zip was built by this workflow from this repository:
#   gh attestation verify erp-made-simple-v1.2.3.zip -R appfide/oracle-fusion-erp-made-simple
# Run it by hand ("Run workflow") to publish a release for an existing tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to release (for example v1.3.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release and upload its files
      id-token: write       # Sigstore keyless signing
      attestations: write   # publish the provenance attestation
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag name
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a version tag like v1.2.3"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0   # sitemap dates come from git history
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: The tag matches the version in package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"; exit 1
          fi
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -R index.html manifest.webmanifest sw.js .nojekyll assets content google*.html _site/
          node scripts/build-seo.mjs _site
          mv _site/indexnow.json indexnow.json   # ping payload, not published
      - name: Package
        run: |
          mkdir dist
          name="erp-made-simple-$TAG"
          # Fixed file order and timestamps, so the same tag always gives the same zip.
          stamp=$(git log -1 --format=%cd --date=format:%Y%m%d%H%M.%S)
          find _site -exec touch -h -t "$stamp" {} +
          (cd _site && find . -type f | LC_ALL=C sort | zip -X -q "../dist/$name.zip" -@)
          (cd dist && sha256sum "$name.zip" > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Sign (SLSA build provenance)
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/erp-made-simple-*.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          name="erp-made-simple-$TAG"
          cp "$BUNDLE" "dist/$name.zip.sigstore.json"            # Sigstore bundle (signature + certificate)
          jq -c '.dsseEnvelope' "$BUNDLE" > "dist/$name.intoto.jsonl"   # the signed in-toto statement
          # Release notes: this version's section of CHANGELOG.md.
          awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          printf '\n---\nVerify: `gh attestation verify %s.zip -R %s`\n' "$name" "$GITHUB_REPOSITORY" >> notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
          fi
