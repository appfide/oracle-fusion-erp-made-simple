name: Validate and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read   # least privilege; only the deploy job gets Pages rights

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # tests compare a pull request with its base
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Validate lesson content
        run: node scripts/validate-content.mjs
      - name: Syntax-check app code
        run: for f in assets/js/*.js sw.js scripts/*.mjs; do node --check "$f"; done
      - name: Lint (coding standard, see CONTRIBUTING.md)
        run: node scripts/lint.mjs
      - name: Test the search-page build
        run: node scripts/build-seo.mjs _seo-test
      - name: Run tests (guardrails, storage, every page in a real browser)
        env:
          CI: 'true'
          CHROME_PATH: /usr/bin/google-chrome
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NODE_V8_COVERAGE: ${{ runner.temp }}/coverage
          COVERAGE_DIR: ${{ runner.temp }}/coverage
        run: node --test tests/*.test.mjs
      - name: Code coverage (fails below 80% of lines)
        env:
          COVERAGE: ${{ runner.temp }}/coverage
        run: node scripts/coverage.mjs --report "$COVERAGE"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write       # Pages deployment and Sigstore signing of the provenance
      attestations: write   # publish the build provenance attestation
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history so sitemap lastmod dates come from git
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -R index.html manifest.webmanifest sw.js .nojekyll assets content google*.html _site/
          node scripts/build-seo.mjs _site
          mv _site/indexnow.json indexnow.json   # ping payload, not published
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true   # publishes .well-known/security.txt
      - name: Sign the exact site that is deployed (SLSA build provenance, verify with `gh attestation verify`)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/artifact.tar
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Tell search engines the pages changed (IndexNow — Bing, Yandex, Seznam, Naver)
        continue-on-error: true
        run: |
          sleep 30
          curl -sS -o /dev/null -w 'IndexNow: HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data @indexnow.json
