name: Validate and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate lesson content
        run: node scripts/validate-content.mjs
      - name: Syntax-check app code
        run: for f in assets/js/*.js sw.js scripts/*.mjs; do node --check "$f"; done
      - name: Test the search-page build
        run: node scripts/build-seo.mjs _seo-test

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history so sitemap lastmod dates come from git
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -R index.html manifest.webmanifest sw.js .nojekyll assets content google*.html _site/
          node scripts/build-seo.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
