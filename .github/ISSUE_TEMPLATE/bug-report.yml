name: App bug
description: The web app does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: "e.g. Chrome 140 on Android"
